name: ARCFirebaseExample
options:
  bundleIdPrefix: com.arclabs.arcfirebase
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  ARCFirebase:
    path: ../../

targets:
  ARCFirebaseExample:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Resources
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arclabs.arcfirebase.example
        PRODUCT_NAME: ARCFirebase Example
        INFOPLIST_GENERATION_MODE: GeneratedFile
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    dependencies:
      - package: ARCFirebase
        product: ARCFirebaseCore
      - package: ARCFirebase
        product: ARCFirebaseAuth
      - package: ARCFirebase
        product: ARCFirebaseAnalytics
      - package: ARCFirebase
        product: ARCFirebaseCrashlytics
      - package: ARCFirebase
        product: ARCFirebasePersistence
      - package: ARCFirebase
        product: ARCFirebaseStorage

schemes:
  ARCFirebaseExample:
    build:
      targets:
        ARCFirebaseExample: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
